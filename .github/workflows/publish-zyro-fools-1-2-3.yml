name: Validate and publish Zyro Fools 1.2.3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-zyro-fools-1-2-3.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download compiled artifacts through private authenticated transfer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $jwt=Invoke-RestMethod ($env:ACTIONS_ID_TOKEN_REQUEST_URL+'&audience=zyro-fools-private-transfer') -Headers @{Authorization=('Bearer '+$env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)}
          $token=$jwt.value
          Write-Output "::add-mask::$token"
          foreach($name in @('ZyroFools-Setup-1.2.3.exe','ZyroFools-1.2.3-Update.zip','desktop-v2.json')){
            Invoke-WebRequest ('https://sb-40j78mafr8uc.vercel.run/'+$name) -Headers @{Authorization=('Bearer '+$token)} -OutFile (Join-Path $env:RUNNER_TEMP $name)
          }
          if((Get-FileHash "$env:RUNNER_TEMP/ZyroFools-Setup-1.2.3.exe").Hash.ToLower() -ne '1fd2b32c937a32432ad027fca3e7425a7de14fd829204ae5c9c45881fa51b778'){throw 'Setup hash mismatch'}
          if((Get-FileHash "$env:RUNNER_TEMP/ZyroFools-1.2.3-Update.zip").Hash.ToLower() -ne 'd7b8736399335d1a12fdd64212962984945203be29a341b4b5320e132fb54e23'){throw 'Patch hash mismatch'}
      - name: Windows fresh install, repeat install and native update transaction
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app=Join-Path $env:LOCALAPPDATA 'Programs/ZyroFools'
          $updater=Join-Path $app 'Updater.exe'
          function Logs {
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'ZyroFools') -Filter '*.log' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {Write-Host $_.FullName;Get-Content $_.FullName -Tail 20}
          }
          function Setup {
            $p=Start-Process "$env:RUNNER_TEMP/ZyroFools-Setup-1.2.3.exe" -ArgumentList '/S' -PassThru
            if(-not $p.WaitForExit(180000)){Logs;throw 'Installer timed out'}
            if($p.ExitCode -ne 0){Logs;throw "Installer failed: $($p.ExitCode)"}
            foreach($n in @('ZyroFools.exe','Updater.exe','resources/app.asar','resources/zyro-updater/Updater.exe','resources/install-payload.json')){if(-not(Test-Path (Join-Path $app $n))){throw "Missing $n"}}
            if(@(Get-ChildItem (Join-Path $env:LOCALAPPDATA 'ZyroFools/Installer') -Directory -Filter 'work-*').Count){throw 'Installer backup not cleaned'}
          }
          function IdleProcesses {
            $env:ELECTRON_RUN_AS_NODE='1'
            $a=Start-Process (Join-Path $app 'ZyroFools.exe') -ArgumentList @('-e','"setInterval(()=>{},1000)"') -PassThru
            $b=Start-Process (Join-Path $app 'ZyroFools.exe') -ArgumentList @('-e','"setInterval(()=>{},1000)"') -PassThru
            Remove-Item Env:ELECTRON_RUN_AS_NODE
            Start-Sleep -Seconds 2
            if($a.HasExited -or $b.HasExited){throw 'Idle process fixture failed'}
            return @($a,$b)
          }
          Setup
          $sentinel=Join-Path $app 'customer-preserved.txt';Set-Content $sentinel 'preserve'
          $userdata=Join-Path $env:APPDATA 'ZyroFools/beta-preserved.txt';New-Item -ItemType Directory -Path (Split-Path $userdata) -Force|Out-Null;Set-Content $userdata 'private-data-preserved'
          $processes=IdleProcesses
          Setup
          foreach($p in $processes){if(-not $p.WaitForExit(10000)){throw 'Setup did not stop owned processes'}}
          if((Get-Content $sentinel) -ne 'preserve' -or (Get-Content $userdata) -ne 'private-data-preserved'){throw 'User data changed'}
          $runner=Join-Path $env:LOCALAPPDATA 'ZyroFools/Updater/runner'
          Get-ChildItem $runner -Filter '*.ps1' | ForEach-Object {$t=$null;$e=$null;[System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$t,[ref]$e)|Out-Null;if($e.Count){throw ($e|Out-String)}}
          $legacy=@'
          const fs=require('fs');const p=Buffer.from(JSON.stringify({version:'1.2.2'}));const j=Buffer.from(JSON.stringify({files:{'package.json':{size:p.length,offset:'0'}}}));const padded=Math.ceil(j.length/4)*4,len=8+padded,h=Buffer.alloc(8+len);h.writeUInt32LE(4,0);h.writeUInt32LE(len,4);h.writeUInt32LE(4+padded,8);h.writeUInt32LE(j.length,12);j.copy(h,16);fs.writeFileSync(process.argv[2],Buffer.concat([h,p]));
          '@
          Set-Content "$env:RUNNER_TEMP/legacy.cjs" $legacy
          node "$env:RUNNER_TEMP/legacy.cjs" (Join-Path $app 'resources/app.asar')
          $processes=IdleProcesses
          Start-Process $updater -ArgumentList @('-Action','Apply','-Target',('"'+$app+'"'),'-Archive',('"'+$env:RUNNER_TEMP+'/ZyroFools-1.2.3-Update.zip"'),'-Envelope',('"'+$env:RUNNER_TEMP+'/desktop-v2.json"'),'-Headless','-NoRestart') -Wait
          $pending=Join-Path $env:LOCALAPPDATA 'ZyroFools/Updater/pending.json'
          for($i=0;$i -lt 120 -and -not(Test-Path $pending);$i++){Start-Sleep -Milliseconds 500}
          if(-not(Test-Path $pending)){Logs;throw 'Update did not produce transaction journal'}
          for($i=0;$i -lt 120;$i++){try{$j=Get-Content $pending -Raw|ConvertFrom-Json;$match=$true;foreach($f in $j.files){if((Get-FileHash (Join-Path $app $f.path)).Hash -ine $f.sha256){$match=$false;break}};if($match){break}}catch{};Start-Sleep -Milliseconds 500}
          if(-not $match){Logs;throw 'Update files not committed'}
          foreach($p in $processes){if(-not $p.WaitForExit(10000)){throw 'Updater did not stop owned processes'}}
          Start-Process $updater -ArgumentList @('-Action','Confirm','-Target',('"'+$app+'"'),'-Headless') -Wait
          for($i=0;$i -lt 120 -and (Test-Path $pending);$i++){Start-Sleep -Milliseconds 500}
          if(Test-Path $pending){Logs;throw 'Update confirmation failed'}
          foreach($n in @('rollback','stage')){if(Test-Path (Join-Path $env:LOCALAPPDATA ('ZyroFools/Updater/'+$n))){throw "Update $n not cleaned"}}
          $inventory=Get-Content (Join-Path $app 'resources/install-payload.json') -Raw|ConvertFrom-Json
          if($inventory.version -ne '1.2.3'){throw 'Installed inventory not updated'}
          if((Get-Content $sentinel) -ne 'preserve' -or (Get-Content $userdata) -ne 'private-data-preserved'){throw 'User data changed during update'}
          if(@(Get-ChildItem (Join-Path $app 'resources/zyro-updater')).Count -ne 1){throw 'Updater source leaked into installed helper folder'}
          Write-Host 'PASS: fresh install, repeat install, native patch apply/confirm, owned-process shutdown, user data preservation and backup cleanup'
      - name: Publish compiled client only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release upload v3.5.15 "$env:RUNNER_TEMP/ZyroFools-Setup-1.2.3.exe" "$env:RUNNER_TEMP/ZyroFools-1.2.3-Update.zip" "$env:RUNNER_TEMP/desktop-v2.json" --repo yLordzy/ZyroVersions --clobber
          if($LASTEXITCODE){throw 'Upload failed'}
          Set-Content "$env:RUNNER_TEMP/notes.txt" 'Zyro Fools 1.2.3 — beta. Setup completo com Updater.exe integrado. Atualização automática por pacote assinado. Instalação nova, atualização nativa, encerramento de processos, preservação de dados e limpeza do backup testados no Windows. Fonte e chave privada não incluídos nos arquivos públicos.'
          gh release edit v3.5.15 --repo yLordzy/ZyroVersions --latest --title 'Zyro Fools 1.2.3' --notes-file "$env:RUNNER_TEMP/notes.txt"
          if($LASTEXITCODE){throw 'Release metadata failed'}
          gh release delete-asset v3.5.15 ZyroFools-1.2.1-Update.zip --repo yLordzy/ZyroVersions --yes
