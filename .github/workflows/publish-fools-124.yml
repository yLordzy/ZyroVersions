name: Publish and verify Zyro Fools 1.2.4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-fools-124.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download private compiled artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $jwt=Invoke-RestMethod ($env:ACTIONS_ID_TOKEN_REQUEST_URL+'&audience=zyro-fools-private-transfer') -Headers @{Authorization=('Bearer '+$env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)}
          Write-Output ("::add-mask::"+$jwt.value)
          foreach($n in @('ZyroFools-Setup-1.2.4.exe','ZyroFools-1.2.4-Update.zip','desktop-v2.json')){
            Invoke-WebRequest ('https://sb-5u27bb01tgaw.vercel.run/'+$n) -Headers @{Authorization=('Bearer '+$jwt.value)} -OutFile (Join-Path $env:RUNNER_TEMP $n)
          }
          if((Get-FileHash "$env:RUNNER_TEMP/ZyroFools-Setup-1.2.4.exe").Hash.ToLower() -ne '56f4a35707c1ee60a3944b2b70556347eb29d17036b92e2b55f40c108378d5c8'){throw 'Setup hash mismatch'}
          if((Get-FileHash "$env:RUNNER_TEMP/ZyroFools-1.2.4-Update.zip").Hash.ToLower() -ne '2161e9f8797043411040cf3742b489b8a90a5d9300614b5fa6c709ece620db19'){throw 'Patch hash mismatch'}
      - name: Upgrade actual 1.2.3 and verify restart and cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://github.com/yLordzy/ZyroVersions/releases/download/v3.5.15/ZyroFools-Setup-1.2.3.exe' -OutFile "$env:RUNNER_TEMP/old.exe"
          $p=Start-Process "$env:RUNNER_TEMP/old.exe" -ArgumentList '/S' -PassThru
          if(-not $p.WaitForExit(180000) -or $p.ExitCode -ne 0){throw 'Baseline setup failed'}
          $app=Join-Path $env:LOCALAPPDATA 'Programs/ZyroFools'
          $sentinel=Join-Path $app 'customer-preserved.txt';Set-Content $sentinel 'preserve'
          Start-Process (Join-Path $app 'ZyroFools.exe')
          Start-Sleep -Seconds 5
          $cache=Join-Path $env:APPDATA 'ZyroFools/UpdatesV2';New-Item -ItemType Directory -Path $cache -Force|Out-Null
          $archive=Join-Path $cache 'ZyroFools-1.2.4-2161e9f879704341-Update.zip'
          Copy-Item "$env:RUNNER_TEMP/ZyroFools-1.2.4-Update.zip" $archive
          Copy-Item "$env:RUNNER_TEMP/desktop-v2.json" ($archive+'.json')
          $p=Start-Process (Join-Path $app 'resources/zyro-updater/Updater.exe') -ArgumentList @('-Action','Apply','-Target',('"'+$app+'"'),'-Archive',('"'+$archive+'"'),'-Envelope',('"'+$archive+'.json"'),'-Headless') -PassThru
          if(-not $p.WaitForExit(15000)){throw 'Launcher did not exit'}
          $pending=Join-Path $env:LOCALAPPDATA 'ZyroFools/Updater/pending.json'
          $ok=$false
          for($i=0;$i -lt 120;$i++){
            $guard=Get-CimInstance Win32_Process|Where-Object {$_.ExecutablePath -ieq (Join-Path $app 'ZyroFools.exe') -and $_.CommandLine -match '--zyro-guard'}
            if($guard -and -not(Test-Path $pending) -and -not(Test-Path $archive) -and (Get-FileHash (Join-Path $app 'resources/app.asar')).Hash.ToLower() -eq '0deed3889d0e610fcd9b8f45ebf0679cc4218d6782b7874a831fdf18556be635'){$ok=$true;break}
            Start-Sleep -Milliseconds 500
          }
          if(-not $ok){Get-ChildItem (Join-Path $env:LOCALAPPDATA 'ZyroFools') -Filter '*.log' -Recurse|ForEach-Object{Write-Host $_.FullName;Get-Content $_.FullName -Tail 15};throw 'Upgrade/restart/cleanup failed'}
          if((Get-Content $sentinel) -ne 'preserve'){throw 'Customer file changed'}
          $p=Start-Process "$env:RUNNER_TEMP/ZyroFools-Setup-1.2.4.exe" -ArgumentList '/S' -PassThru
          if(-not $p.WaitForExit(180000) -or $p.ExitCode -ne 0){throw 'New setup failed'}
          if((Get-Content $sentinel) -ne 'preserve'){throw 'Customer file changed during setup'}
          $inventory=Get-Content (Join-Path $app 'resources/install-payload.json') -Raw|ConvertFrom-Json
          if($inventory.version -ne '1.2.4'){throw 'Wrong installed version'}
          if(@(Get-ChildItem (Join-Path $env:LOCALAPPDATA 'ZyroFools/Installer') -Filter 'work-*' -Directory).Count){throw 'Installer backup remained'}
          Write-Host 'PASS: real 1.2.3 -> 1.2.4 native upgrade, panel/Guard restart, automatic confirmation, managed-cache cleanup, setup upgrade and user file preservation'
      - name: Publish compiled release and test online channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release create v1.2.4 "$env:RUNNER_TEMP/ZyroFools-Setup-1.2.4.exe" "$env:RUNNER_TEMP/ZyroFools-1.2.4-Update.zip" "$env:RUNNER_TEMP/desktop-v2.json" --repo yLordzy/ZyroVersions --latest --title 'Zyro Fools 1.2.4' --notes 'Corrige o nome da segunda integração para OpenSteamTools, mantendo o identificador do backend. Atualização assinada, reinício do painel e Guard e limpeza testados a partir da instalação real 1.2.3. Código fonte não incluído.'
          if($LASTEXITCODE){throw 'Publication failed'}
          $test=@'
          const fs=require('fs'),os=require('os'),path=require('path');
          const app=path.join(process.env.LOCALAPPDATA,'Programs','ZyroFools','resources','app.asar');
          const {Updater}=require(path.join(app,'updater-core.js'));
          (async()=>{const cache=fs.mkdtempSync(path.join(os.tmpdir(),'zyro-online-'));try{const u=new Updater({config:require(path.join(app,'update-config.json')),current:'1.2.3',cache});await u.check();if(u.state.status!=='ready'||u.state.version!=='1.2.4')throw Error(JSON.stringify(u.state));console.log('PASS: public Latest metadata signature and real online update download from 1.2.3 to 1.2.4');}finally{fs.rmSync(cache,{recursive:true,force:true})}})().catch(e=>{console.error(e);process.exitCode=1});
          '@
          Set-Content "$env:RUNNER_TEMP/online.cjs" $test
          $env:ELECTRON_RUN_AS_NODE='1'
          & (Join-Path $env:LOCALAPPDATA 'Programs/ZyroFools/ZyroFools.exe') "$env:RUNNER_TEMP/online.cjs"
          if($LASTEXITCODE){throw 'Online updater verification failed'}
